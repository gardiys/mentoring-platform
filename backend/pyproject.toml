[tool.poetry]
name = "mentoring-platform-backend"
version = "0.1.0"
description = "Backend for the mentoring platform MVP"
authors = ["Mentoring Platform"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.141.1"
starlette = "^1.3.1"
uvicorn = {version = "^0.35.0", extras = ["standard"]}
sqlalchemy = "^2.0.41"
greenlet = "^3.2.4"
asyncpg = "^0.30.0"
alembic = "^1.16.4"
pydantic-settings = "^2.10.1"
httpx = "^0.28.1"
pyjwt = {version = "^2.10.1", extras = ["crypto"]}
cryptography = "^50.0.0"
boto3 = "^1.40.0"
arq = "^0.26.3"
redis = "^5.3.1"
openai = "^2.21.0"
nexara = "^0.5.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.1"
pytest-asyncio = "^1.1.0"
ruff = "^0.12.5"
mypy = "^1.17.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["migrations"]

[[tool.mypy.overrides]]
module = "asyncpg.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*"]
ignore_missing_imports = true
