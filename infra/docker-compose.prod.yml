name: mentoring-platform-production

x-backend-environment: &backend-environment
  APP_ENV: production
  APP_DEBUG: "false"
  DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env.production}
  CORS_ORIGINS: https://${DOMAIN:?Set DOMAIN in .env.production}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?Set TELEGRAM_BOT_TOKEN in .env.production}
  BOT_INTEGRATION_TOKEN: ${BOT_INTEGRATION_TOKEN:?Set BOT_INTEGRATION_TOKEN in .env.production}
  TELEGRAM_INIT_DATA_TTL_SECONDS: ${TELEGRAM_INIT_DATA_TTL_SECONDS:-86400}
  TELEGRAM_WEB_CLIENT_ID: ${TELEGRAM_WEB_CLIENT_ID:?Set TELEGRAM_WEB_CLIENT_ID in .env.production}
  TELEGRAM_WEB_CLIENT_SECRET: ${TELEGRAM_WEB_CLIENT_SECRET:?Set TELEGRAM_WEB_CLIENT_SECRET in .env.production}
  TELEGRAM_WEB_REDIRECT_URI: https://${DOMAIN:?Set DOMAIN in .env.production}/api/v1/auth/web/telegram/callback
  TELEGRAM_OIDC_PROXY_URL: ${TELEGRAM_OIDC_PROXY_URL:-}
  WEB_FRONTEND_URL: https://${DOMAIN:?Set DOMAIN in .env.production}
  WEB_SESSION_SECRET: ${WEB_SESSION_SECRET:?Set WEB_SESSION_SECRET in .env.production}
  WEB_SESSION_TTL_SECONDS: ${WEB_SESSION_TTL_SECONDS:-2592000}
  S3_BUCKET: ${S3_BUCKET:?Set S3_BUCKET in .env.production}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
  S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID in .env.production}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY in .env.production}
  S3_PRESIGN_TTL_SECONDS: ${S3_PRESIGN_TTL_SECONDS:-900}
  INTERVIEW_STREAM_TICKET_TTL_SECONDS: ${INTERVIEW_STREAM_TICKET_TTL_SECONDS:-600}
  INTERVIEW_VIDEO_MAX_BYTES: ${INTERVIEW_VIDEO_MAX_BYTES:-2147483648}
  INTERVIEW_AUDIO_MAX_BYTES: ${INTERVIEW_AUDIO_MAX_BYTES:-524288000}
  INTERVIEW_OFFER_MAX_BYTES: ${INTERVIEW_OFFER_MAX_BYTES:-20971520}
  INTERVIEW_ATTACHMENT_MAX_BYTES: ${INTERVIEW_ATTACHMENT_MAX_BYTES:-52428800}
  REDIS_URL: redis://redis:6379/0
  TRANSCRIPTION_PROVIDER: ${TRANSCRIPTION_PROVIDER:?Set TRANSCRIPTION_PROVIDER in .env.production}
  TRANSCRIPTION_MAX_CONCURRENCY: ${TRANSCRIPTION_MAX_CONCURRENCY:-4}
  NEXARA_API_KEY: ${NEXARA_API_KEY:?Set NEXARA_API_KEY in .env.production}
  NEXARA_BASE_URL: ${NEXARA_BASE_URL:-https://api.nexara.ru/v1}
  NEXARA_MODEL: ${NEXARA_MODEL:-whisper-1}
  NEXARA_TIMEOUT_SECONDS: ${NEXARA_TIMEOUT_SECONDS:-600}
  NEXARA_MAX_RETRIES: ${NEXARA_MAX_RETRIES:-2}
  INTERVIEW_AI_PROVIDER: ${INTERVIEW_AI_PROVIDER:?Set INTERVIEW_AI_PROVIDER in .env.production}
  OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY in .env.production}
  OPENAI_ANALYSIS_MODEL: ${OPENAI_ANALYSIS_MODEL:?Set OPENAI_ANALYSIS_MODEL in .env.production}
  OPENAI_EXTRACTION_MODEL: ${OPENAI_EXTRACTION_MODEL:?Set OPENAI_EXTRACTION_MODEL in .env.production}
  OPENAI_LIGHT_REVIEW_MODEL: ${OPENAI_LIGHT_REVIEW_MODEL:-}
  OPENAI_PROXY_URL: ${OPENAI_PROXY_URL:-}
  OPENAI_TIMEOUT_SECONDS: ${OPENAI_TIMEOUT_SECONDS:-120}
  OPENAI_MAX_RETRIES: ${OPENAI_MAX_RETRIES:-0}

x-logging: &default-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "5"

services:
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *default-logging

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mentoring}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
      POSTGRES_DB: ${POSTGRES_DB:-mentoring}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-mentoring} -d ${POSTGRES_DB:-mentoring}",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *default-logging

  migrate:
    build:
      context: ../backend
    environment: *backend-environment
    command: alembic upgrade head
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    logging: *default-logging

  backend:
    build:
      context: ../backend
    restart: unless-stopped
    init: true
    environment: *backend-environment
    command:
      [
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--workers",
        "${BACKEND_WORKERS:-2}",
        "--proxy-headers",
        "--forwarded-allow-ips=*",
      ]
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    logging: *default-logging

  intelligence-worker:
    build:
      context: ../backend
    restart: unless-stopped
    init: true
    environment: *backend-environment
    command: arq app.interviews.intelligence_jobs.WorkerSettings
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    logging: *default-logging

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile.production
      args:
        VITE_API_URL: ""
        VITE_TELEGRAM_BOT_URL: ${TELEGRAM_BOT_URL:?Set TELEGRAM_BOT_URL in .env.production}
    restart: unless-stopped
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 10
    logging: *default-logging

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env.production}
      CADDY_EMAIL: ${CADDY_EMAIL:?Set CADDY_EMAIL in .env.production}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    logging: *default-logging

volumes:
  postgres_data:
    # Keep the database outside the Compose project lifecycle. In particular,
    # `docker compose down -v` never removes volumes declared as external.
    # This is also the exact name used by earlier versions of this project, so
    # an existing production database is reused during the upgrade.
    external: true
    name: mentoring-platform-production_postgres_data
  caddy_data:
  caddy_config:
  redis_data:
