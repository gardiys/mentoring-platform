x-logging: &default-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "5"

services:
  redis-permissions:
    image: redis:7.4-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    restart: "no"
    user: "0:0"
    entrypoint: ["chown"]
    command: ["-R", "999:1000", "/data"]
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE]
    security_opt: [no-new-privileges:true]
    pids_limit: 16
    mem_limit: 64m
    cpus: 0.1
    network_mode: none
    volumes:
      - redis_data:/data
    logging: *default-logging

  redis:
    image: redis:7.4-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    restart: unless-stopped
    init: true
    user: "999:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 1g
    cpus: 1.0
    tmpfs:
      - /tmp:size=16m,mode=1777
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env.production}
      REDISCLI_AUTH: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env.production}
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env.production}
    volumes:
      - redis_data:/data
    networks: [data]
    depends_on:
      redis-permissions:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    logging: *default-logging

  postgres-permissions:
    image: mentoring-platform-postgres:16.14-hardened
    restart: "no"
    user: "0:0"
    entrypoint: ["chown"]
    command: ["70:70", "/var/lib/postgresql/data"]
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN]
    security_opt: [no-new-privileges:true]
    pids_limit: 16
    mem_limit: 32m
    cpus: 0.1
    network_mode: none
    volumes:
      - postgres_data:/var/lib/postgresql/data
    logging: *default-logging

  postgres:
    image: mentoring-platform-postgres:16.14-hardened
    build:
      context: ./postgres
    restart: unless-stopped
    init: true
    user: "70:70"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 2g
    cpus: 2.0
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /var/run/postgresql:size=16m,uid=70,gid=70,mode=3775
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mentoring}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
      POSTGRES_DB: ${POSTGRES_DB:-mentoring}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [data]
    depends_on:
      postgres-permissions:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-mentoring} -d ${POSTGRES_DB:-mentoring}",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *default-logging

  migrate:
    build:
      context: ../backend
      target: migration
    environment: *common-environment
    command: alembic upgrade head
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 1g
    cpus: 1.0
    tmpfs:
      - /tmp:size=64m,mode=1777
    depends_on:
      postgres:
        condition: service_healthy
    networks: [data]
    restart: "no"
    logging: *default-logging

  backend:
    build:
      context: ../backend
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 1g
    cpus: 2.0
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - interview_legacy_transcode:/var/lib/mentoring/interview-legacy-transcode
    environment: *backend-environment
    command:
      [
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--workers",
        "${BACKEND_WORKERS:-2}",
        # Uvicorn's access log includes the raw query string (for example the
        # Telegram OAuth code/state). app.http already emits sanitized path-only logs.
        "--no-access-log",
        "--proxy-headers",
        "--forwarded-allow-ips=*",
      ]
    expose:
      - "8000"
    networks: [edge, data]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    logging: *default-logging

  intelligence-worker: &intelligence-worker
    build:
      context: ../backend
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 3g
    cpus: 2.0
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - interview_staging:/tmp/interview-staging
    environment: *transcription-environment
    networks: [data, egress]
    command: arq app.interviews.intelligence_jobs.TranscriptionWorkerSettings
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "arq",
          "app.interviews.intelligence_jobs.TranscriptionWorkerSettings",
          "--check",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 40s
    logging: *default-logging

  intelligence-ai-worker:
    <<: *intelligence-worker
    environment: *ai-environment
    command: arq app.interviews.intelligence_jobs.AIWorkerSettings
    mem_limit: 1g
    cpus: 1.5
    volumes: []
    healthcheck:
      test:
        [
          "CMD",
          "arq",
          "app.interviews.intelligence_jobs.AIWorkerSettings",
          "--check",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 40s

  content-media-worker:
    build:
      context: ../backend
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 1g
    cpus: 1.0
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - content_media_normalization:/var/lib/mentoring/content-media-normalization
    environment: *content-media-environment
    networks: [data, egress]
    command: arq app.media.normalization_jobs.ContentMediaWorkerSettings
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "arq",
          "app.media.normalization_jobs.ContentMediaWorkerSettings",
          "--check",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 40s
    logging: *default-logging

  notification-worker:
    build:
      context: ../backend
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.5
    tmpfs:
      - /tmp:size=16m,mode=1777
    environment:
      <<: *common-environment
      CORS_ORIGINS: https://${DOMAIN:?Set DOMAIN in .env.production}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?Set TELEGRAM_BOT_TOKEN in .env.production}
      TELEGRAM_BOT_PROXY_URL: ${TELEGRAM_BOT_PROXY_URL:-}
      TELEGRAM_INTERVIEW_CHAT_ID: ${TELEGRAM_INTERVIEW_CHAT_ID:-}
      TELEGRAM_GROUP_TOPIC_ID: ${TELEGRAM_GROUP_TOPIC_ID:-}
      TELEGRAM_INTERVIEW_PYTHON_CHAT_ID: ${TELEGRAM_INTERVIEW_PYTHON_CHAT_ID:-}
      TELEGRAM_INTERVIEW_PYTHON_TOPIC_ID: ${TELEGRAM_INTERVIEW_PYTHON_TOPIC_ID:-}
      TELEGRAM_INTERVIEW_GO_CHAT_ID: ${TELEGRAM_INTERVIEW_GO_CHAT_ID:-}
      TELEGRAM_INTERVIEW_GO_TOPIC_ID: ${TELEGRAM_INTERVIEW_GO_TOPIC_ID:-}
      WEB_FRONTEND_URL: https://${DOMAIN:?Set DOMAIN in .env.production}
      NOTIFICATION_REMINDER_TIMEZONE: ${NOTIFICATION_REMINDER_TIMEZONE:-Europe/Moscow}
      NOTIFICATION_REMINDER_HOUR: ${NOTIFICATION_REMINDER_HOUR:-10}
      TELEGRAM_GROUP_CALL_REMINDERS_ENABLED: ${TELEGRAM_GROUP_CALL_REMINDERS_ENABLED:-true}
      TELEGRAM_GROUP_CALL_REMINDER_MINUTES: ${TELEGRAM_GROUP_CALL_REMINDER_MINUTES:-30}
      TELEGRAM_DAILY_REMINDERS_ENABLED: ${TELEGRAM_DAILY_REMINDERS_ENABLED:-true}
      TELEGRAM_DAILY_REMINDER_HOUR: ${TELEGRAM_DAILY_REMINDER_HOUR:-20}
    networks: [data, egress]
    command: arq app.notifications.jobs.NotificationWorkerSettings
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "arq",
          "app.notifications.jobs.NotificationWorkerSettings",
          "--check",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging: *default-logging

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile.production
      args:
        VITE_API_URL: ""
        VITE_TELEGRAM_BOT_URL: ${TELEGRAM_BOT_URL:?Set TELEGRAM_BOT_URL in .env.production}
    restart: unless-stopped
    init: true
    user: "101:101"
    entrypoint: ["nginx"]
    command: ["-g", "daemon off;"]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.5
    tmpfs:
      - /var/cache/nginx:size=32m,uid=101,gid=101,mode=0750
      - /var/run:size=1m,uid=101,gid=101,mode=0750
      - /tmp:size=16m,uid=101,gid=101,mode=1777
    expose:
      - "8080"
    networks: [edge]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 10
    logging: *default-logging

  caddy-permissions:
    image: mentoring-platform-caddy:2.11.4-hardened
    restart: "no"
    user: "0:0"
    entrypoint: ["chown"]
    command: ["-R", "100:101", "/data", "/config"]
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE]
    security_opt: [no-new-privileges:true]
    pids_limit: 16
    mem_limit: 32m
    cpus: 0.1
    network_mode: none
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    logging: *default-logging

  caddy:
    image: mentoring-platform-caddy:2.11.4-hardened
    build:
      context: ./caddy
    restart: unless-stopped
    init: true
    user: "100:101"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    sysctls:
      net.ipv4.ip_unprivileged_port_start: "0"
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.5
    tmpfs:
      - /tmp:size=16m,mode=1777
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env.production}
      CADDY_EMAIL: ${CADDY_EMAIL:?Set CADDY_EMAIL in .env.production}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge]
    depends_on:
      caddy-permissions:
        condition: service_completed_successfully
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    logging: *default-logging

networks:
  # Public-facing containers cannot open direct connections to PostgreSQL or
  # Redis. Only the backend bridges the edge and private data networks.
  edge:
  data:
    internal: true
  # Media and AI workers need outbound HTTPS but never join the edge network.
  egress:

volumes:
  postgres_data:
    # Keep the database outside the Compose project lifecycle. In particular,
    # `docker compose down -v` never removes volumes declared as external.
    # This is also the exact name used by earlier versions of this project, so
    # an existing production database is reused during the upgrade.
    external: true
    name: mentoring-platform-production_postgres_data
  caddy_data:
  caddy_config:
  redis_data:
    external: true
    name: mentoring-platform-production_redis_data
  interview_staging:
  interview_legacy_transcode:
  content_media_normalization:
