      CONTENT_MEDIA_NORMALIZATION_OUTPUT_OVERHEAD_BYTES: ${CONTENT_MEDIA_NORMALIZATION_OUTPUT_OVERHEAD_BYTES:-536870912}
      CONTENT_MEDIA_NORMALIZATION_CLEANUP_AGE_SECONDS: ${CONTENT_MEDIA_NORMALIZATION_CLEANUP_AGE_SECONDS:-86400}
      CONTENT_MEDIA_NORMALIZATION_TIMEOUT_SECONDS: ${CONTENT_MEDIA_NORMALIZATION_TIMEOUT_SECONDS:-14400}
      CONTENT_MEDIA_NORMALIZATION_STALE_SECONDS: ${CONTENT_MEDIA_NORMALIZATION_STALE_SECONDS:-18000}
      CONTENT_MEDIA_NORMALIZATION_JOB_EXPIRES_SECONDS: ${CONTENT_MEDIA_NORMALIZATION_JOB_EXPIRES_SECONDS:-604800}
