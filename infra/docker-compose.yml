services:
  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mentoring}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mentoring}
      POSTGRES_DB: ${POSTGRES_DB:-mentoring}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mentoring} -d ${POSTGRES_DB:-mentoring}"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY_ID:-mentoring-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_ACCESS_KEY:-mentoring-minio-secret}
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:5173
      # MinIO OSS does not implement bucket AbortIncompleteMultipartUpload.
      # These server-wide guards provide the equivalent cleanup, while the
      # separate lifecycle rule below expires completed pending/ objects.
      MINIO_API_STALE_UPLOADS_EXPIRY: 24h
      MINIO_API_STALE_UPLOADS_CLEANUP_INTERVAL: 1h
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    environment:
      S3_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY_ID:-mentoring-minio}
      S3_SECRET_ACCESS_KEY: ${MINIO_SECRET_ACCESS_KEY:-mentoring-minio-secret}
      S3_BUCKET: ${MINIO_BUCKET:-mentoring-platform}
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >-
      /bin/sh -c '
      mc alias set local http://minio:9000 "$${S3_ACCESS_KEY_ID}" "$${S3_SECRET_ACCESS_KEY}";
      mc mb --ignore-existing "local/$${S3_BUCKET}";
      mc anonymous set none "local/$${S3_BUCKET}";
      mc ilm rule import "local/$${S3_BUCKET}" < /config/minio-lifecycle.json;
      '
    volumes:
      - ./minio-lifecycle.json:/config/minio-lifecycle.json:ro

  backend:
    build: ../backend
    environment:
      APP_ENV: development
      APP_DEBUG: "true"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-mentoring}:${POSTGRES_PASSWORD:-mentoring}@postgres:5432/${POSTGRES_DB:-mentoring}
      CORS_ORIGINS: http://localhost:5173
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      BOT_INTEGRATION_TOKEN: ${BOT_INTEGRATION_TOKEN:-}
      S3_BUCKET: ${MINIO_BUCKET:-mentoring-platform}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ENDPOINT_URL: http://minio:9000
      S3_PUBLIC_ENDPOINT_URL: http://localhost:9000
      S3_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY_ID:-mentoring-minio}
      S3_SECRET_ACCESS_KEY: ${MINIO_SECRET_ACCESS_KEY:-mentoring-minio-secret}
      S3_MULTIPART_PART_SIZE_BYTES: ${S3_MULTIPART_PART_SIZE_BYTES:-67108864}
      S3_MULTIPART_PRESIGN_TTL_SECONDS: ${S3_MULTIPART_PRESIGN_TTL_SECONDS:-21600}
      S3_MULTIPART_SESSION_TTL_SECONDS: ${S3_MULTIPART_SESSION_TTL_SECONDS:-86400}
      INTERVIEW_STREAM_TICKET_TTL_SECONDS: ${INTERVIEW_STREAM_TICKET_TTL_SECONDS:-600}
      MEDIA_STREAM_REDIRECT_TTL_SECONDS: ${MEDIA_STREAM_REDIRECT_TTL_SECONDS:-900}
      CONTENT_VIDEO_MAX_BYTES: ${CONTENT_VIDEO_MAX_BYTES:-5368709120}
      INTERVIEW_VIDEO_MAX_BYTES: ${INTERVIEW_VIDEO_MAX_BYTES:-2147483648}
      INTERVIEW_AUDIO_MAX_BYTES: ${INTERVIEW_AUDIO_MAX_BYTES:-524288000}
      INTERVIEW_OFFER_MAX_BYTES: ${INTERVIEW_OFFER_MAX_BYTES:-20971520}
      INTERVIEW_ATTACHMENT_MAX_BYTES: ${INTERVIEW_ATTACHMENT_MAX_BYTES:-52428800}
      INTERVIEW_LEGACY_TRANSCODE_DIRECTORY: /var/lib/mentoring/interview-legacy-transcode
      INTERVIEW_LEGACY_TRANSCODE_MAX_CONCURRENCY: ${INTERVIEW_LEGACY_TRANSCODE_MAX_CONCURRENCY:-1}
      INTERVIEW_LEGACY_TRANSCODE_MIN_FREE_BYTES: ${INTERVIEW_LEGACY_TRANSCODE_MIN_FREE_BYTES:-2147483648}
      INTERVIEW_LEGACY_TRANSCODE_MAX_RESERVED_BYTES: ${INTERVIEW_LEGACY_TRANSCODE_MAX_RESERVED_BYTES:-1073741824}
      INTERVIEW_LEGACY_TRANSCODE_CLEANUP_AGE_SECONDS: ${INTERVIEW_LEGACY_TRANSCODE_CLEANUP_AGE_SECONDS:-86400}
      INTERVIEW_LEGACY_TRANSCODE_TIMEOUT_SECONDS: ${INTERVIEW_LEGACY_TRANSCODE_TIMEOUT_SECONDS:-600}
      INTERVIEW_MEDIA_MAX_DURATION_SECONDS: ${INTERVIEW_MEDIA_MAX_DURATION_SECONDS:-14400}
      INTERVIEW_STAGING_DIRECTORY: ${INTERVIEW_STAGING_DIRECTORY:-/tmp/interview-staging}
      INTERVIEW_STAGING_MAX_CONCURRENCY: ${INTERVIEW_STAGING_MAX_CONCURRENCY:-2}
      INTERVIEW_STAGING_MIN_FREE_BYTES: ${INTERVIEW_STAGING_MIN_FREE_BYTES:-2147483648}
      INTERVIEW_STAGING_MAX_RESERVED_BYTES: ${INTERVIEW_STAGING_MAX_RESERVED_BYTES:-4294967296}
      INTERVIEW_STAGING_CLEANUP_AGE_SECONDS: ${INTERVIEW_STAGING_CLEANUP_AGE_SECONDS:-86400}
      INTERVIEW_MEDIA_PROBE_TIMEOUT_SECONDS: ${INTERVIEW_MEDIA_PROBE_TIMEOUT_SECONDS:-20}
      REDIS_URL: redis://redis:6379/0
      INTELLIGENCE_JOB_EXPIRES_SECONDS: ${INTELLIGENCE_JOB_EXPIRES_SECONDS:-604800}
      TRANSCRIPTION_PROVIDER: ${TRANSCRIPTION_PROVIDER:-fake}
      TRANSCRIPTION_MAX_CONCURRENCY: ${TRANSCRIPTION_MAX_CONCURRENCY:-4}
      TRANSCRIPTION_JOB_TIMEOUT_SECONDS: ${TRANSCRIPTION_JOB_TIMEOUT_SECONDS:-3600}
      TRANSCRIPTION_POLL_DEADLINE_SECONDS: ${TRANSCRIPTION_POLL_DEADLINE_SECONDS:-21600}
      NEXARA_API_KEY: ${NEXARA_API_KEY:-}
      NEXARA_BASE_URL: ${NEXARA_BASE_URL:-https://api.nexara.ru/v1}
      NEXARA_MODEL: ${NEXARA_MODEL:-whisper-1}
      NEXARA_TIMEOUT_SECONDS: ${NEXARA_TIMEOUT_SECONDS:-600}
      NEXARA_MAX_RETRIES: ${NEXARA_MAX_RETRIES:-0}
      INTERVIEW_AI_PROVIDER: ${INTERVIEW_AI_PROVIDER:-fake}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_ANALYSIS_MODEL: ${OPENAI_ANALYSIS_MODEL:-}
      OPENAI_EXTRACTION_MODEL: ${OPENAI_EXTRACTION_MODEL:-}
      OPENAI_LIGHT_REVIEW_MODEL: ${OPENAI_LIGHT_REVIEW_MODEL:-}
      OPENAI_PROXY_URL: ${OPENAI_PROXY_URL:-}
      OPENAI_MAX_RETRIES: ${OPENAI_MAX_RETRIES:-0}
      OPENAI_MAX_CONCURRENCY: ${OPENAI_MAX_CONCURRENCY:-4}
      OPENAI_JOB_TIMEOUT_SECONDS: ${OPENAI_JOB_TIMEOUT_SECONDS:-3600}
      OPENAI_EXTRACTION_MAX_OUTPUT_TOKENS: ${OPENAI_EXTRACTION_MAX_OUTPUT_TOKENS:-8000}
      OPENAI_REVIEW_MAX_OUTPUT_TOKENS: ${OPENAI_REVIEW_MAX_OUTPUT_TOKENS:-4000}
      OPENAI_SUMMARY_MAX_OUTPUT_TOKENS: ${OPENAI_SUMMARY_MAX_OUTPUT_TOKENS:-4000}
      INTERVIEW_AI_ENABLED: ${INTERVIEW_AI_ENABLED:-true}
      INTERVIEW_AI_DAILY_LIMIT: ${INTERVIEW_AI_DAILY_LIMIT:-3}
      INTERVIEW_AI_MAX_ACTIVE_PER_USER: ${INTERVIEW_AI_MAX_ACTIVE_PER_USER:-1}
      INTERVIEW_AI_GLOBAL_ACTIVE_LIMIT: ${INTERVIEW_AI_GLOBAL_ACTIVE_LIMIT:-50}
      INTERVIEW_AI_QUOTA_TIMEZONE: ${INTERVIEW_AI_QUOTA_TIMEZONE:-Europe/Moscow}
      TELEGRAM_INIT_DATA_TTL_SECONDS: ${TELEGRAM_INIT_DATA_TTL_SECONDS:-86400}
    ports:
      - "8000:8000"
    volumes:
      - ../backend:/app
      - interview_legacy_transcode:/var/lib/mentoring/interview-legacy-transcode
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  intelligence-worker: &intelligence-worker
    build: ../backend
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-mentoring}:${POSTGRES_PASSWORD:-mentoring}@postgres:5432/${POSTGRES_DB:-mentoring}
      REDIS_URL: redis://redis:6379/0
      INTELLIGENCE_JOB_EXPIRES_SECONDS: ${INTELLIGENCE_JOB_EXPIRES_SECONDS:-604800}
      TRANSCRIPTION_PROVIDER: ${TRANSCRIPTION_PROVIDER:-fake}
      TRANSCRIPTION_MAX_CONCURRENCY: ${TRANSCRIPTION_MAX_CONCURRENCY:-4}
      TRANSCRIPTION_JOB_TIMEOUT_SECONDS: ${TRANSCRIPTION_JOB_TIMEOUT_SECONDS:-3600}
      TRANSCRIPTION_POLL_DEADLINE_SECONDS: ${TRANSCRIPTION_POLL_DEADLINE_SECONDS:-21600}
      NEXARA_API_KEY: ${NEXARA_API_KEY:-}
      NEXARA_BASE_URL: ${NEXARA_BASE_URL:-https://api.nexara.ru/v1}
      NEXARA_MODEL: ${NEXARA_MODEL:-whisper-1}
      NEXARA_TIMEOUT_SECONDS: ${NEXARA_TIMEOUT_SECONDS:-600}
      NEXARA_MAX_RETRIES: ${NEXARA_MAX_RETRIES:-0}
      INTERVIEW_AI_PROVIDER: ${INTERVIEW_AI_PROVIDER:-fake}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_ANALYSIS_MODEL: ${OPENAI_ANALYSIS_MODEL:-}
      OPENAI_EXTRACTION_MODEL: ${OPENAI_EXTRACTION_MODEL:-}
      OPENAI_LIGHT_REVIEW_MODEL: ${OPENAI_LIGHT_REVIEW_MODEL:-}
      OPENAI_PROXY_URL: ${OPENAI_PROXY_URL:-}
      OPENAI_MAX_RETRIES: ${OPENAI_MAX_RETRIES:-0}
      OPENAI_MAX_CONCURRENCY: ${OPENAI_MAX_CONCURRENCY:-4}
      OPENAI_JOB_TIMEOUT_SECONDS: ${OPENAI_JOB_TIMEOUT_SECONDS:-3600}
      OPENAI_EXTRACTION_MAX_OUTPUT_TOKENS: ${OPENAI_EXTRACTION_MAX_OUTPUT_TOKENS:-8000}
      OPENAI_REVIEW_MAX_OUTPUT_TOKENS: ${OPENAI_REVIEW_MAX_OUTPUT_TOKENS:-4000}
      OPENAI_SUMMARY_MAX_OUTPUT_TOKENS: ${OPENAI_SUMMARY_MAX_OUTPUT_TOKENS:-4000}
      INTERVIEW_AI_ENABLED: ${INTERVIEW_AI_ENABLED:-true}
      INTERVIEW_AI_DAILY_LIMIT: ${INTERVIEW_AI_DAILY_LIMIT:-3}
      INTERVIEW_AI_MAX_ACTIVE_PER_USER: ${INTERVIEW_AI_MAX_ACTIVE_PER_USER:-1}
      INTERVIEW_AI_GLOBAL_ACTIVE_LIMIT: ${INTERVIEW_AI_GLOBAL_ACTIVE_LIMIT:-50}
      INTERVIEW_AI_QUOTA_TIMEZONE: ${INTERVIEW_AI_QUOTA_TIMEZONE:-Europe/Moscow}
      S3_BUCKET: ${MINIO_BUCKET:-mentoring-platform}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ENDPOINT_URL: http://minio:9000
      S3_PUBLIC_ENDPOINT_URL: ${NEXARA_MEDIA_PUBLIC_ENDPOINT_URL:-http://minio:9000}
      S3_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY_ID:-mentoring-minio}
      S3_SECRET_ACCESS_KEY: ${MINIO_SECRET_ACCESS_KEY:-mentoring-minio-secret}
      INTERVIEW_MEDIA_MAX_DURATION_SECONDS: ${INTERVIEW_MEDIA_MAX_DURATION_SECONDS:-14400}
      INTERVIEW_STAGING_DIRECTORY: ${INTERVIEW_STAGING_DIRECTORY:-/tmp/interview-staging}
      INTERVIEW_STAGING_MAX_CONCURRENCY: ${INTERVIEW_STAGING_MAX_CONCURRENCY:-2}
      INTERVIEW_STAGING_MIN_FREE_BYTES: ${INTERVIEW_STAGING_MIN_FREE_BYTES:-2147483648}
      INTERVIEW_STAGING_MAX_RESERVED_BYTES: ${INTERVIEW_STAGING_MAX_RESERVED_BYTES:-4294967296}
      INTERVIEW_STAGING_CLEANUP_AGE_SECONDS: ${INTERVIEW_STAGING_CLEANUP_AGE_SECONDS:-86400}
      INTERVIEW_MEDIA_PROBE_TIMEOUT_SECONDS: ${INTERVIEW_MEDIA_PROBE_TIMEOUT_SECONDS:-20}
    volumes:
      - ../backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    command: arq app.interviews.intelligence_jobs.TranscriptionWorkerSettings
    healthcheck:
      test:
        [
          "CMD",
          "arq",
          "app.interviews.intelligence_jobs.TranscriptionWorkerSettings",
          "--check",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 40s

  intelligence-ai-worker:
    <<: *intelligence-worker
    command: arq app.interviews.intelligence_jobs.AIWorkerSettings
    healthcheck:
      test:
        [
          "CMD",
          "arq",
          "app.interviews.intelligence_jobs.AIWorkerSettings",
          "--check",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 40s

  frontend:
    build: ../frontend
    environment:
      VITE_API_URL: http://localhost:8000
      VITE_DEV_STUDENT_ID: ${VITE_DEV_STUDENT_ID:-20000000-0000-4000-8000-000000000001}
      VITE_DEV_MENTOR_ID: ${VITE_DEV_MENTOR_ID:-10000000-0000-4000-8000-000000000001}
      VITE_DEV_ADMIN_ID: ${VITE_DEV_ADMIN_ID:-90000000-0000-4000-8000-000000000001}
    ports:
      - "5173:5173"
    volumes:
      - ../frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
  minio_data:
  interview_legacy_transcode:
  redis_data:
  frontend_node_modules:
