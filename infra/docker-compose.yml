      TELEGRAM_INTERVIEW_PYTHON_TOPIC_ID: ${TELEGRAM_INTERVIEW_PYTHON_TOPIC_ID:-}
      TELEGRAM_INTERVIEW_GO_CHAT_ID: ${TELEGRAM_INTERVIEW_GO_CHAT_ID:-}
      TELEGRAM_INTERVIEW_GO_TOPIC_ID: ${TELEGRAM_INTERVIEW_GO_TOPIC_ID:-}
      WEB_FRONTEND_URL: http://localhost:5173
      NOTIFICATION_REMINDER_TIMEZONE: ${NOTIFICATION_REMINDER_TIMEZONE:-Europe/Moscow}
      NOTIFICATION_REMINDER_HOUR: ${NOTIFICATION_REMINDER_HOUR:-10}
      TELEGRAM_GROUP_CALL_REMINDERS_ENABLED: ${TELEGRAM_GROUP_CALL_REMINDERS_ENABLED:-true}
      TELEGRAM_GROUP_CALL_REMINDER_MINUTES: ${TELEGRAM_GROUP_CALL_REMINDER_MINUTES:-30}
      TELEGRAM_DAILY_REMINDERS_ENABLED: ${TELEGRAM_DAILY_REMINDERS_ENABLED:-true}
      TELEGRAM_DAILY_REMINDER_HOUR: ${TELEGRAM_DAILY_REMINDER_HOUR:-20}
    volumes:
      - ../backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    command: arq app.notifications.jobs.NotificationWorkerSettings
    healthcheck:
      test:
        [
          "CMD",
          "arq",
          "app.notifications.jobs.NotificationWorkerSettings",
          "--check",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Keep the persistent dependency volume in sync with the bind-mounted
  # package files. This one-shot service also repairs volumes created by the
  # older root-based frontend image before the application starts as `node`.
  frontend-deps:
    image: infra-frontend
    user: "0:0"
    environment:
      CI: "true"
    volumes:
      - ../frontend:/app
      - frontend_node_modules:/app/node_modules
    command:
      - sh
      - -ec
      - |
        chown -R node:node /app/node_modules
        exec su node -s /bin/sh -c 'pnpm install --frozen-lockfile'
    restart: "no"

  frontend:
    image: infra-frontend
    build: ../frontend
    environment:
      VITE_API_URL: http://localhost:8000
      VITE_DEV_STUDENT_ID: ${VITE_DEV_STUDENT_ID:-20000000-0000-4000-8000-000000000001}
      VITE_DEV_MENTOR_ID: ${VITE_DEV_MENTOR_ID:-10000000-0000-4000-8000-000000000001}
      VITE_DEV_ADMIN_ID: ${VITE_DEV_ADMIN_ID:-90000000-0000-4000-8000-000000000001}
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ../frontend:/app
      - frontend_node_modules:/app/node_modules
    # Calling Vite directly avoids pnpm's interactive dependency-status check.
    # Dependency installation is handled by the one-shot service above.
    command: ["node", "node_modules/vite/bin/vite.js", "--host", "0.0.0.0"]
    depends_on:
      backend:
        condition: service_started
      frontend-deps:
        condition: service_completed_successfully

volumes:
  postgres_data:
  minio_data:
  interview_legacy_transcode:
  content_media_normalization:
  redis_data:
  frontend_node_modules:
