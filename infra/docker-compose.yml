services:
  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mentoring}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mentoring}
      POSTGRES_DB: ${POSTGRES_DB:-mentoring}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mentoring} -d ${POSTGRES_DB:-mentoring}"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY_ID:-mentoring-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_ACCESS_KEY:-mentoring-minio-secret}
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:5173
      # MinIO OSS does not implement bucket AbortIncompleteMultipartUpload.
      # These server-wide guards provide the equivalent cleanup, while the
      # separate lifecycle rule below expires completed pending/ objects.
      MINIO_API_STALE_UPLOADS_EXPIRY: 24h
      MINIO_API_STALE_UPLOADS_CLEANUP_INTERVAL: 1h
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    environment:
      S3_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY_ID:-mentoring-minio}
      S3_SECRET_ACCESS_KEY: ${MINIO_SECRET_ACCESS_KEY:-mentoring-minio-secret}
      S3_BUCKET: ${MINIO_BUCKET:-mentoring-platform}
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >-
      /bin/sh -c '
      mc alias set local http://minio:9000 "$${S3_ACCESS_KEY_ID}" "$${S3_SECRET_ACCESS_KEY}";
      mc mb --ignore-existing "local/$${S3_BUCKET}";
      mc anonymous set none "local/$${S3_BUCKET}";
      mc ilm rule import "local/$${S3_BUCKET}" < /config/minio-lifecycle.json;
      '
    volumes:
      - ./minio-lifecycle.json:/config/minio-lifecycle.json:ro

  migrate:
    build:
      context: ../backend
      target: migration
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-mentoring}:${POSTGRES_PASSWORD:-mentoring}@postgres:5432/${POSTGRES_DB:-mentoring}
    volumes:
      - ../backend:/app
    depends_on:
      postgres:
        condition: service_healthy
    command: alembic upgrade head
    restart: "no"

  backend:
    build: ../backend
    environment:
      APP_ENV: development
      APP_DEBUG: "true"
      DEV_AUTH_ENABLED: "true"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-mentoring}:${POSTGRES_PASSWORD:-mentoring}@postgres:5432/${POSTGRES_DB:-mentoring}
      CORS_ORIGINS: http://localhost:5173
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_PROXY_URL: ${TELEGRAM_BOT_PROXY_URL:-}
      TELEGRAM_INTERVIEW_CHAT_ID: ${TELEGRAM_INTERVIEW_CHAT_ID:-}
      TELEGRAM_GROUP_TOPIC_ID: ${TELEGRAM_GROUP_TOPIC_ID:-}
      TELEGRAM_INTERVIEW_PYTHON_CHAT_ID: ${TELEGRAM_INTERVIEW_PYTHON_CHAT_ID:-}
      TELEGRAM_INTERVIEW_PYTHON_TOPIC_ID: ${TELEGRAM_INTERVIEW_PYTHON_TOPIC_ID:-}
      TELEGRAM_INTERVIEW_GO_CHAT_ID: ${TELEGRAM_INTERVIEW_GO_CHAT_ID:-}
      TELEGRAM_INTERVIEW_GO_TOPIC_ID: ${TELEGRAM_INTERVIEW_GO_TOPIC_ID:-}
      NOTIFICATION_REMINDER_TIMEZONE: ${NOTIFICATION_REMINDER_TIMEZONE:-Europe/Moscow}
      NOTIFICATION_REMINDER_HOUR: ${NOTIFICATION_REMINDER_HOUR:-10}
      TELEGRAM_GROUP_CALL_REMINDERS_ENABLED: ${TELEGRAM_GROUP_CALL_REMINDERS_ENABLED:-true}
      TELEGRAM_GROUP_CALL_REMINDER_MINUTES: ${TELEGRAM_GROUP_CALL_REMINDER_MINUTES:-30}
      TELEGRAM_DAILY_REMINDERS_ENABLED: ${TELEGRAM_DAILY_REMINDERS_ENABLED:-true}
      TELEGRAM_DAILY_REMINDER_HOUR: ${TELEGRAM_DAILY_REMINDER_HOUR:-20}
      BOT_INTEGRATION_TOKEN: ${BOT_INTEGRATION_TOKEN:-}
      TOCHKA_CLIENT_ID: ${TOCHKA_CLIENT_ID:-}
      TOCHKA_JWT_TOKEN: ${TOCHKA_JWT_TOKEN:-}
      TOCHKA_API_BASE_URL: ${TOCHKA_API_BASE_URL:-https://enter.tochka.com/uapi}
      TOCHKA_PROXY_URL: ${TOCHKA_PROXY_URL:-}
      TOCHKA_PUBLIC_KEY: ${TOCHKA_PUBLIC_KEY:-}
      TOCHKA_CUSTOMER_CODE: ${TOCHKA_CUSTOMER_CODE:-}
      TOCHKA_REDIRECT_URL: ${TOCHKA_REDIRECT_URL:-}
      TOCHKA_FAIL_REDIRECT_URL: ${TOCHKA_FAIL_REDIRECT_URL:-}
      TOCHKA_PAYMENT_MODES: ${TOCHKA_PAYMENT_MODES:-sbp,card}
